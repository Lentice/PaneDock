<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaneDock UI concepts</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --faint: #98a2b3;
      --line: #dfe5ec;
      --line-strong: #cbd5e1;
      --canvas: #eef2f6;
      --surface: #ffffff;
      --surface-soft: #f7f9fb;
      --blue: #2563eb;
      --blue-soft: #eaf1ff;
      --teal: #0f766e;
      --amber: #b45309;
      --violet: #6d4aff;
      --shadow: 0 18px 45px rgba(22, 34, 51, .12), 0 2px 8px rgba(22, 34, 51, .06);
      --radius: 14px;
      --ui: Inter, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 22px 22px 92px;
      color: var(--ink);
      background: #e9eef4;
      font: 13px/1.35 var(--ui);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, .28);
      outline-offset: 1px;
    }
    .prototype-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1500px;
      margin: 0 auto 12px;
      color: #536173;
      font-size: 12px;
      letter-spacing: .02em;
    }
    .prototype-header strong { color: var(--ink); font-size: 13px; }
    .prototype-header .hint { color: #7c8999; }

    .app-window {
      position: relative;
      display: grid;
      width: min(1500px, 100%);
      height: min(850px, calc(100vh - 72px));
      min-height: 620px;
      margin: auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid #d4dce6;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .icon { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.sm { width: 14px; height: 14px; flex-basis: 14px; }
    .icon.lg { width: 19px; height: 19px; flex-basis: 19px; }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .text-button, .icon-button, .layout-button, .group-button, .tab-button, .rail-button { cursor: pointer; border: 0; background: transparent; }
    .icon-button, .layout-button, .rail-button {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: #64748b;
    }
    .icon-button:hover, .layout-button:hover, .rail-button:hover { color: var(--blue); background: #edf3ff; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      color: #475569;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 650;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }

    /* Shared group and native-view details. */
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      color: white;
      background: #1f64e7;
      box-shadow: 0 5px 12px rgba(37, 99, 235, .24);
    }
    .brand-mark .icon { width: 17px; height: 17px; }
    .brand-name { font-size: 14px; font-weight: 760; letter-spacing: -.02em; }
    .group-list { display: grid; gap: 4px; }
    .group-button {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 7px 10px;
      text-align: left;
      border-radius: 10px;
      color: #4b5565;
    }
    .group-button:hover { background: #f2f5f8; }
    .group-button.is-active { color: #174bb4; background: var(--blue-soft); }
    .group-copy { min-width: 0; }
    .group-copy strong, .group-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-copy strong { font-size: 12px; font-weight: 700; }
    .group-copy small { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .group-count { color: #8995a6; font-size: 10px; font-variant-numeric: tabular-nums; }
    .sidebar-actions { display: grid; gap: 6px; }
    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 10px;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #526075;
      font-size: 11px;
      font-weight: 650;
    }
    .action-row:hover { border-color: #b9cdf4; color: var(--blue); background: #f8fbff; }

    .pane-board { min-width: 0; min-height: 0; display: grid; gap: 8px; }
    .pane {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #d8e0e8;
      border-radius: 10px;
      background: #fff;
    }
    .pane.is-active { border-color: #7da7f3; box-shadow: inset 0 0 0 1px rgba(37,99,235,.18), 0 4px 12px rgba(37,99,235,.08); }
    .pane-tabs { display: flex; align-items: center; min-width: 0; height: 31px; padding: 0 6px; border-bottom: 1px solid #e6ebf0; background: #f8fafc; }
    .tab-button {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      height: 25px;
      padding: 0 8px;
      border-radius: 6px;
      color: #3e4c60;
      font-size: 11px;
      font-weight: 650;
    }
    .tab-button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(22,34,51,.08); }
    .tab-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-button .icon { color: #7b8796; }
    .pane-tabs .icon-button { margin-left: auto; width: 26px; height: 26px; }
    .pane-toolbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px; border-bottom: 1px solid #eef1f4; background: #fff; }
    .nav-buttons { display: flex; gap: 2px; }
    .nav-buttons .icon-button { width: 26px; height: 26px; border-radius: 6px; }
    .location {
      min-width: 0;
      height: 27px;
      padding: 0 9px;
      border: 1px solid #d9e1ea;
      border-radius: 6px;
      outline: 0;
      color: #4c596b;
      background: #fbfcfd;
      font-size: 11px;
    }
    .location:focus { border-color: #8bb0f5; background: #fff; }
    .view-tools { display: flex; gap: 2px; }
    .view-tools .icon-button { width: 26px; height: 26px; }
    .file-head, .file-row { display: grid; grid-template-columns: minmax(120px, 1.2fr) minmax(86px, .8fr) 74px; gap: 10px; align-items: center; }
    .file-head { min-height: 29px; padding: 0 12px; color: #8190a2; border-bottom: 1px solid #edf0f3; font-size: 10px; font-weight: 700; }
    .file-body { overflow: hidden; padding: 3px 5px 6px; }
    .file-row { min-height: 30px; padding: 0 7px; border-radius: 6px; color: #344054; font-size: 11px; }
    .file-row:hover { background: #f2f6fb; }
    .file-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .file-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-icon { color: #e7a514; fill: #ffd873; stroke: #c58b06; }
    .file-icon { color: #7b8ca4; }
    .file-meta { overflow: hidden; color: #8a96a5; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: #8a96a5; text-align: right; font-variant-numeric: tabular-nums; }
    .pane-status { display: flex; align-items: center; justify-content: space-between; min-height: 24px; padding: 0 10px; margin-top: auto; color: #9aa5b3; border-top: 1px solid #f0f2f5; font-size: 10px; }

    /* 01 — Utility Classic: closest to the current implementation, but quieter and clearer. */
    .v1 { grid-template-columns: 226px minmax(0, 1fr); }
    .v1 .sidebar { display: flex; flex-direction: column; gap: 22px; padding: 20px 13px 14px; background: #fbfcfe; border-right: 1px solid var(--line); }
    .v1 .group-area { min-height: 0; overflow: auto; }
    .v1 .sidebar-label { display: flex; align-items: center; justify-content: space-between; margin: 0 9px 8px; }
    .v1 .sidebar-label button { width: 22px; height: 22px; border: 0; border-radius: 6px; color: var(--blue); background: var(--blue-soft); cursor: pointer; }
    .v1 .sidebar-actions { margin-top: auto; }
    .v1 .main-surface { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: #f3f6f9; }
    .v1 .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 0 22px; background: #fff; border-bottom: 1px solid var(--line); }
    .v1 .title-stack { display: grid; gap: 4px; }
    .v1 .workspace-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 760; letter-spacing: -.03em; }
    .v1 .workspace-title .dot { margin-left: 3px; }
    .v1 .top-actions { display: flex; align-items: center; gap: 7px; }
    .v1 .layout-picker { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #f8fafc; }
    .v1 .layout-button { width: 27px; height: 27px; }
    .v1 .layout-button.active { color: var(--blue); background: #fff; box-shadow: 0 1px 4px rgba(22,34,51,.1); }
    .v1 .board-wrap { min-width: 0; min-height: 0; padding: 15px; flex: 1; }
    .v1 .pane-board { height: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
    .v1 .workspace-footer { display: flex; justify-content: space-between; padding: 0 17px 10px; color: #8591a0; font-size: 10px; }

    /* 02 — Workspace Dock: compact rail plus a denser command surface. */
    .v2 { grid-template-columns: 64px 210px minmax(0, 1fr); background: #f8fafc; }
    .v2 .icon-rail { display: flex; align-items: center; flex-direction: column; gap: 12px; padding: 17px 11px; background: #172033; color: #b8c5d8; }
    .v2 .icon-rail .brand-mark { width: 34px; height: 34px; margin-bottom: 14px; color: #172033; background: #fff; box-shadow: none; }
    .v2 .icon-rail .brand-mark .icon { color: var(--blue); }
    .v2 .rail-button { width: 39px; height: 39px; border-radius: 10px; color: #9ba9bd; }
    .v2 .rail-button:hover, .v2 .rail-button.active { color: #fff; background: rgba(255,255,255,.12); }
    .v2 .rail-spacer { flex: 1; }
    .v2 .group-dock { display: flex; min-width: 0; min-height: 0; flex-direction: column; padding: 19px 12px 12px; background: #fff; border-right: 1px solid var(--line); }
    .v2 .dock-heading { display: flex; align-items: flex-start; justify-content: space-between; margin: 0 7px 15px; }
    .v2 .dock-heading strong { display: block; margin-top: 3px; font-size: 15px; letter-spacing: -.02em; }
    .v2 .group-list { overflow: auto; }
    .v2 .group-button { grid-template-columns: minmax(0, 1fr); min-height: 52px; }
    .v2 .group-button .group-count { display: none; }
    .v2 .dock-bottom { display: grid; gap: 9px; margin-top: auto; padding: 12px 6px 2px; border-top: 1px solid #eef1f4; }
    .v2 .storage-line { display: flex; align-items: center; justify-content: space-between; color: #718096; font-size: 10px; }
    .v2 .storage-meter { height: 5px; overflow: hidden; border-radius: 99px; background: #edf1f5; }
    .v2 .storage-meter span { display: block; width: 63%; height: 100%; border-radius: inherit; background: #77a8f8; }
    .v2 .main-surface { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: #eef2f6; }
    .v2 .commandbar { display: grid; gap: 13px; padding: 18px 22px 15px; background: #fff; border-bottom: 1px solid var(--line); }
    .v2 .command-top, .v2 .command-bottom { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .v2 .command-title { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 760; letter-spacing: -.03em; }
    .v2 .command-title small { color: #8390a0; font-size: 11px; font-weight: 500; }
    .v2 .breadcrumbs { display: flex; align-items: center; gap: 7px; min-width: 0; color: #69788c; font-size: 11px; }
    .v2 .breadcrumbs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .v2 .command-input { display: flex; align-items: center; flex: 0 1 250px; height: 30px; padding: 0 10px; gap: 8px; color: #8995a5; border: 1px solid var(--line); border-radius: 7px; background: #f8fafc; }
    .v2 .command-input input { width: 100%; min-width: 0; border: 0; outline: 0; color: #4b5563; background: transparent; font-size: 11px; }
    .v2 .layout-picker { display: flex; gap: 4px; }
    .v2 .layout-button { border: 1px solid transparent; }
    .v2 .layout-button.active { color: var(--blue); border-color: #cfe0ff; background: #eaf1ff; }
    .v2 .board-wrap { min-width: 0; min-height: 0; padding: 14px 16px 16px; flex: 1; }
    .v2 .pane-board { height: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .v2 .pane { border-radius: 12px; box-shadow: 0 2px 8px rgba(35,52,73,.04); }
    .v2 .pane.is-active { box-shadow: inset 0 0 0 1px rgba(37,99,235,.18), 0 6px 16px rgba(37,99,235,.1); }

    /* 03 — Focus Canvas: group navigation behaves like a workspace switcher, with one dominant pane. */
    .v3 { grid-template-columns: 196px minmax(0, 1fr); }
    .v3 .sidebar { display: flex; min-height: 0; flex-direction: column; padding: 18px 11px 13px; background: #f8fafc; border-right: 1px solid var(--line); }
    .v3 .sidebar .brand { padding: 0 8px 18px; }
    .v3 .workspace-card { padding: 13px; margin: 0 4px 17px; border: 1px solid #d9e5fb; border-radius: 12px; background: #edf4ff; }
    .v3 .workspace-card strong { display: block; margin-top: 6px; font-size: 13px; }
    .v3 .workspace-card p { margin: 4px 0 0; color: #65748a; font-size: 10px; }
    .v3 .sidebar-label { margin: 0 9px 8px; }
    .v3 .group-button { grid-template-columns: minmax(0, 1fr); min-height: 42px; padding: 6px 9px; }
    .v3 .group-button .group-count { display: none; }
    .v3 .recent { display: grid; gap: 8px; margin: auto 8px 0; padding-top: 13px; border-top: 1px solid #e4e9ef; }
    .v3 .recent a { display: flex; align-items: center; gap: 7px; overflow: hidden; color: #6f7d8f; font-size: 10px; text-decoration: none; }
    .v3 .recent a:hover { color: var(--blue); }
    .v3 .main-surface { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: #fff; }
    .v3 .workspace-tabs { display: flex; align-items: flex-end; gap: 4px; min-height: 55px; padding: 0 19px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
    .v3 .workspace-tab { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 13px; cursor: pointer; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #718096; font-weight: 650; }
    .v3 .workspace-tab:hover { color: var(--blue); }
    .v3 .workspace-tab.active { color: var(--ink); border-color: var(--blue); }
    .v3 .workspace-tab .dot { width: 6px; height: 6px; }
    .v3 .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 20px; border-bottom: 1px solid #edf0f3; }
    .v3 .toolbar-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .v3 .toolbar-title { overflow: hidden; color: #344054; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .v3 .toolbar-title span { color: #8b98a8; font-weight: 500; }
    .v3 .layout-picker { display: flex; align-items: center; gap: 3px; padding-left: 10px; border-left: 1px solid var(--line); }
    .v3 .layout-button.active { color: var(--blue); background: var(--blue-soft); }
    .v3 .canvas-wrap { min-width: 0; min-height: 0; padding: 16px 20px 20px; flex: 1; background: #f6f8fa; }
    .v3 .pane-board { height: 100%; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .95fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .v3 .pane:first-child { grid-row: span 2; }
    .v3 .pane { border-radius: 12px; }
    .v3 .pane:first-child .file-row { min-height: 34px; }

    /* 04 — Soft Canvas: airy, almost frameless panes with the Group as the primary context. */
    .v4 { grid-template-columns: 248px minmax(0, 1fr); background: #f7f8fa; }
    .v4 .sidebar { display: flex; min-height: 0; flex-direction: column; padding: 24px 16px; background: #fff; border-right: 1px solid #e8ebef; }
    .v4 .sidebar .brand { padding: 0 8px 30px; }
    .v4 .side-heading { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 8px 10px; }
    .v4 .side-heading strong { font-size: 16px; letter-spacing: -.03em; }
    .v4 .side-heading button { display: grid; place-items: center; width: 26px; height: 26px; cursor: pointer; border: 0; border-radius: 8px; color: #5576b2; background: #edf3ff; }
    .v4 .group-list { gap: 8px; }
    .v4 .group-button { grid-template-columns: minmax(0, 1fr); min-height: 64px; padding: 10px 11px; border: 1px solid transparent; border-radius: 12px; }
    .v4 .group-button.is-active { border-color: #d7e5ff; background: #f0f5ff; }
    .v4 .group-button .group-count { display: none; }
    .v4 .sidebar-footnote { display: flex; align-items: center; gap: 8px; margin: auto 8px 0; padding-top: 15px; color: #7b8798; border-top: 1px solid #eef1f4; font-size: 10px; }
    .v4 .main-surface { display: flex; min-width: 0; min-height: 0; flex-direction: column; padding: 25px 28px 18px; background: #f7f8fa; }
    .v4 .hero-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 0 2px 21px; }
    .v4 .hero-head h1 { margin: 5px 0 0; font-size: 24px; letter-spacing: -.05em; }
    .v4 .hero-head p { margin: 5px 0 0; color: #748195; font-size: 11px; }
    .v4 .hero-actions { display: flex; align-items: center; gap: 7px; }
    .v4 .hero-actions .pill { background: #eef8f2; color: #27754a; }
    .v4 .board-wrap { min-width: 0; min-height: 0; flex: 1; }
    .v4 .pane-board { height: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .v4 .pane { border-color: #e1e6ec; border-radius: 16px; box-shadow: 0 5px 14px rgba(24,40,61,.035); }
    .v4 .pane-tabs { height: 39px; padding: 0 10px; background: #fff; }
    .v4 .pane-toolbar { padding: 8px 10px; }
    .v4 .pane-status { min-height: 28px; }

    .prototype-switcher {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 7px 9px;
      transform: translateX(-50%);
      border: 1px solid #27354a;
      border-radius: 15px;
      color: #dce6f4;
      background: rgba(23, 32, 51, .97);
      box-shadow: 0 12px 35px rgba(16, 24, 40, .22);
    }
    .prototype-switcher > button { display: grid; place-items: center; width: 34px; height: 34px; cursor: pointer; border: 1px solid #3c4b63; border-radius: 9px; color: #dce6f4; background: #25324a; }
    .prototype-switcher > button:hover { border-color: #8eb4ff; color: #fff; background: #304362; }
    .prototype-switcher .switcher-label { min-width: 172px; padding: 0 5px; }
    .prototype-switcher .switcher-label small { display: block; color: #90a1ba; font-size: 9px; font-weight: 750; letter-spacing: .14em; }
    .prototype-switcher .switcher-label strong { display: block; margin-top: 2px; color: #fff; font-size: 12px; }
    .variant-dots { display: flex; gap: 4px; padding-left: 8px; border-left: 1px solid #3d4b60; }
    .variant-dots button { width: 20px; height: 20px; cursor: pointer; border: 0; border-radius: 6px; color: #95a5bc; background: transparent; font-size: 10px; }
    .variant-dots button:hover, .variant-dots button.active { color: #fff; background: #45628c; }
    .toast { position: fixed; z-index: 30; top: 20px; left: 50%; padding: 9px 13px; opacity: 0; transform: translate(-50%, -10px); border: 1px solid #cfe0ff; border-radius: 8px; color: #174bb4; background: #f4f8ff; box-shadow: 0 8px 25px rgba(22,34,51,.12); pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .solo .prototype-header, .solo .prototype-switcher { display: none; }
    .solo { padding: 0; }
    .solo .app-window { width: 100%; height: 100vh; min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }

    /* Refined Demo 01: only core context and pane-layout controls remain. */
    .refined-shell { grid-template-columns: 226px minmax(0, 1fr); }
    .refined-shell .sidebar { display: flex; min-height: 0; flex-direction: column; gap: 22px; padding: 20px 13px 14px; background: #fbfcfe; border-right: 1px solid var(--line); }
    .refined-shell .sidebar .brand { padding: 0 8px; }
    .refined-shell .group-area { min-height: 0; overflow: auto; }
    .refined-shell .sidebar-label { display: flex; align-items: center; justify-content: space-between; margin: 0 9px 8px; }

      return `<div class="app-window v4">
        <aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('dock')}</span><span class="brand-name">PaneDock</span></div><div class="side-heading"><strong>Groups</strong><button type="button" data-action="new-group" aria-label="New group">${icon('plus', 'sm')}</button></div><div class="group-list">${groupButtons()}</div><div class="sidebar-footnote">${icon('check', 'sm')} <span>All changes saved locally</span></div></aside>
        <main class="main-surface"><div class="hero-head"><div><div class="eyebrow">Workspace overview</div><h1>Client work</h1><p>Keep the folders for this context in one calm, predictable surface.</p></div><div class="hero-actions"><span class="pill"><span class="dot"></span> 4 locations open</span>${layoutPicker('grid')}</div></div><div class="board-wrap"><div class="pane-board">${[0,1,2,3].map(index => paneMarkup(index)).join('')}</div></div></main>
      </div>`;
    }

    function refinedSidebar(withLayout = false) {
      return `<aside class="sidebar">
        <div class="brand"><span class="brand-mark">${icon('dock')}</span><span class="brand-name">PaneDock</span></div>
        <div class="group-area"><div class="sidebar-label"><span class="eyebrow">Groups</span><button type="button" data-action="new-group" aria-label="New group">${icon('plus', 'sm')}</button></div><div class="group-list">${groupButtons()}</div></div>
        ${withLayout ? `<div class="sidebar-layout"><div class="eyebrow">Pane layout</div>${layoutPicker('grid')}</div>` : ''}
        <div class="sidebar-actions"><button type="button" class="action-row" data-action="new-group">${icon('plus', 'sm')} New group</button><button type="button" class="action-row" data-action="settings">${icon('settings', 'sm')} Preferences</button></div>
      </aside>`;
    }

    function refinedBoard(count = 4) {
      return `<div class="pane-board">${Array.from({ length: count }, (_, index) => paneMarkup(index)).join('')}</div>`;
    }

    function verticalLayoutPicker() {
      return `<div class="layout-picker" aria-label="Pane layout">
        <button type="button" class="layout-button" data-action="layout" data-layout="single" aria-label="Single pane">${icon('monitor', 'sm')}</button>
        <button type="button" class="layout-button" data-action="layout" data-layout="split" aria-label="Left and right panes">${icon('splitColumns', 'sm')}</button>
        <button type="button" class="layout-button" data-action="layout" data-layout="stack" aria-label="Top and bottom panes">${icon('splitRows', 'sm')}</button>
        <button type="button" class="layout-button" data-action="layout" data-layout="three" aria-label="Three panes">${icon('three', 'sm')}</button>
        <button type="button" class="layout-button active" data-action="layout" data-layout="grid" aria-label="Four panes">${icon('grid', 'sm')}</button>
      </div>`;
    }

    function refinedVariantOne() {
      return `<div class="app-window refined-shell refined-quiet">${refinedSidebar()}
        <main class="main-surface"><div class="quietbar"><span class="eyebrow">Pane layout</span>${layoutPicker('grid')}<button type="button" class="icon-button" data-action="more" aria-label="More actions">${icon('more')}</button></div><div class="board-wrap">${refinedBoard()}</div></main>
      </div>`;
    }

    function refinedVariantTwo() {
      return `<div class="app-window refined-shell refined-board-toolbar">${refinedSidebar()}
        <main class="main-surface"><div class="board-toolbar"><span class="eyebrow">Layout</span>${layoutPicker('grid')}</div><div class="board-wrap">${refinedBoard()}</div></main>
      </div>`;
    }

    function refinedVariantThree() {
      return `<div class="app-window refined-side-controls">${refinedSidebar()}<aside class="control-rail"><span class="rail-label">LAYOUT</span>${verticalLayoutPicker()}</aside>
        <main class="main-surface"><div class="board-wrap">${refinedBoard()}</div></main>
      </div>`;
    }

    function refinedVariantFour() {
      return `<div class="app-window refined-shell refined-pane-canvas">${refinedSidebar(true)}
        <main class="main-surface"><div class="board-wrap">${refinedBoard()}</div></main>
      </div>`;
    }

    function render() {
      const renderers = refinedMode ? [refinedVariantOne, refinedVariantTwo, refinedVariantThree, refinedVariantFour] : [variantOne, variantTwo, variantThree, variantFour];
      const labels = refinedMode ? refinedVariants : variants;
      const renderer = renderers[currentVariant - 1];
      document.getElementById('app').innerHTML = renderer();
      document.querySelector('.switcher-label small').textContent = `${refinedMode ? 'REFINED 01' : 'CONCEPT'} / 0${currentVariant}`;
      document.querySelector('.switcher-label strong').textContent = labels[currentVariant].name;
      document.querySelectorAll('[data-variant]').forEach(button => button.classList.toggle('active', Number(button.dataset.variant) === currentVariant));
    }

    function toast(message) {
      const element = document.getElementById('toast');
      element.textContent = message;
      element.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => element.classList.remove('show'), 1200);
    }

    function setVariant(next) {
      currentVariant = next < 1 ? 4 : next > 4 ? 1 : next;
      const url = new URL(location.href);
      url.searchParams.set('variant', currentVariant);
      history.replaceState({}, '', url);
      render();
    }

    document.addEventListener('click', event => {
      const variantButton = event.target.closest('[data-variant]');
      if (variantButton) return setVariant(Number(variantButton.dataset.variant));
      const switchButton = event.target.closest('[data-switch]');
      if (switchButton) return setVariant(currentVariant + (switchButton.dataset.switch === 'next' ? 1 : -1));
      const groupButton = event.target.closest('[data-group]');
      if (groupButton) { activeGroup = Number(groupButton.dataset.group); activePane = 0; render(); return toast(`Switched to ${groups[activeGroup].name}`); }
      const pane = event.target.closest('[data-pane]');
      if (pane && !event.target.closest('button, input')) { activePane = Number(pane.dataset.pane); render(); return; }
      const action = event.target.closest('[data-action]');
      if (!action) return;
      event.preventDefault();
      if (action.dataset.action === 'layout') return toast(`${action.dataset.layout} layout selected`);
      if (action.dataset.action === 'new-group') return toast('New group action');
      if (action.dataset.action === 'settings') return toast('Preferences action');
      toast(`${action.dataset.action[0].toUpperCase()}${action.dataset.action.slice(1)} action`);
    });
    document.addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
      if (event.key === 'ArrowLeft') setVariant(currentVariant - 1);
      if (event.key === 'ArrowRight') setVariant(currentVariant + 1);
    });
    render();
  </script>
</body>
</html>
